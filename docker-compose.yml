services:
  pulse:
    build:
      context: ./server
    image: pulse-server:latest
    container_name: pulse-server
    ports:
      - "${PULSE_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      # Local timezone — must match the workplace for the work-hours filter.
      TZ: "${TZ:-UTC}"
      # First-run bootstrap admin (change the password!).
      PULSE_ADMIN_USER: "${PULSE_ADMIN_USER:-admin}"
      PULSE_ADMIN_PASS: "${PULSE_ADMIN_PASS:-}"
      # Session / CSRF token lifetime in minutes.
      PULSE_SESSION_TTL_MIN: "${PULSE_SESSION_TTL_MIN:-60}"
      # Seconds of silence before a device is shown offline.
      PULSE_ONLINE_WINDOW_SEC: "${PULSE_ONLINE_WINDOW_SEC:-120}"
      # Set true when running behind an HTTPS reverse proxy.
      PULSE_SECURE_COOKIES: "${PULSE_SECURE_COOKIES:-false}"
      # Update repo is hardcoded to TMarccci/pulse; override only if you fork.
      PULSE_REPO: "${PULSE_REPO:-TMarccci/pulse}"
    restart: unless-stopped
