name: Server Release

# Tag the server as server-vX.Y.Z to package the zip and push a Docker image.
on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^server-v',''
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build server package
        shell: pwsh
        run: ./scripts/build-server.ps1 -Version ${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-server-${{ steps.ver.outputs.version }}
          path: dist/pulse-server-${{ steps.ver.outputs.version }}.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pulse-server-${{ steps.ver.outputs.version }}.zip
          name: Pulse Server ${{ steps.ver.outputs.version }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#server-v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pulse-server:latest
            ghcr.io/${{ github.repository }}/pulse-server:${{ steps.ver.outputs.version }}
