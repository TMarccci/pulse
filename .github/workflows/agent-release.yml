name: Agent Release

# Tag the agent as agent-vX.Y.Z to build the installer and publish a Release.
on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^agent-v',''
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build agent + installer
        shell: pwsh
        run: ./scripts/build-agent.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseAgentSetup-${{ steps.ver.outputs.version }}
          path: installer/client/Output/PulseAgentSetup-${{ steps.ver.outputs.version }}.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/client/Output/PulseAgentSetup-${{ steps.ver.outputs.version }}.exe
          name: Pulse Agent ${{ steps.ver.outputs.version }}
          body: |
            Pulse Agent ${{ steps.ver.outputs.version }}

            Installed agents auto-update to this release when it is newer than
            their running version (self-update via GitHub Releases).
